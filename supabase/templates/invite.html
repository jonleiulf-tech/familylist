<!--
  «Invite user»-malen i Supabase (Authentication → Emails → Invite user).

  Brukes bare hvis du inviterer noen fra Supabase-dashbordet. Invitasjonene
  fra selve appen går som vanlige innloggingslenker, altså magic-link-malen.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#e6e4e4;margin:0;padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:480px;background:#f3f2f2;border:2px solid #201e1d;">
        <tr>
          <td style="padding:22px 24px 18px;border-bottom:2px solid #201e1d;">
            <div style="font-family:Archivo,'Helvetica Neue',Arial,sans-serif;font-weight:800;
                        font-size:20px;letter-spacing:-0.015em;color:#201e1d;line-height:1;">
              PLUKKELISTEN<span style="color:#ec3013;">.</span>
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 24px 24px;">
            <h1 style="margin:0 0 14px;font-family:Archivo,'Helvetica Neue',Arial,sans-serif;
                       font-weight:800;font-size:23px;line-height:1.15;letter-spacing:-0.02em;color:#201e1d;">
              Du er invitert
            </h1>
            <p style="margin:0 0 22px;font-family:'Helvetica Neue',Arial,sans-serif;
                      font-size:15px;line-height:1.55;color:#201e1d;">
              Dere deler handleliste og middagsplan. Endringer synkes med én
              gang — legger den ene til melk, ser den andre det umiddelbart.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
              <tr>
                <td style="background:#ec3013;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:inline-block;padding:14px 22px;font-family:Archivo,'Helvetica Neue',Arial,sans-serif;
                            font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">
                    Bli med
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:0;font-family:'Courier New',monospace;font-size:12px;
                      line-height:1.45;color:#625c59;word-break:break-all;">
              {{ .ConfirmationURL }}
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 24px;border-top:2px solid #201e1d;background:#e6e4e4;">
            <p style="margin:0;font-family:'Helvetica Neue',Arial,sans-serif;
                      font-size:11px;line-height:1.5;color:#625c59;">
              Plukkelisten · <a href="https://plukkelisten.no" style="color:#ec3013;text-decoration:none;">plukkelisten.no</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
