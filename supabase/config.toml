project_id = "familylist"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

# Kassalapp-proxyen krever innlogget bruker (verifiseres i koden),
# så vi lar plattformen slippe forespørselen inn og sjekker JWT selv.
[functions.kassal-products]
verify_jwt = true

[functions.receipt-ocr]
verify_jwt = true

# Kalles av pg_cron med service_role-nøkkel, ikke av en innlogget bruker.
[functions.weekly-offer-scan]
verify_jwt = false

[functions.kassal-offer-scan]
verify_jwt = false
