project_id = "familylist"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

# Kassalapp-proxyen krever innlogget bruker (verifiseres i koden),
# så vi lar plattformen slippe forespørselen inn og sjekker JWT selv.
[functions.kassal-products]
verify_jwt = true

[functions.receipt-ocr]
verify_jwt = true

# Kalles av pg_cron med service_role-nøkkel, ikke av en innlogget bruker.
[functions.weekly-offer-scan]
verify_jwt = false

[functions.kassal-offer-scan]
verify_jwt = false

[functions.send-invite]
verify_jwt = true

# Kalles av pg_cron med service_role-nøkkel (nattlig gjennomgang av meldte feil).
[functions.review-item-reports]
verify_jwt = false

# Adminpanelet — krever innlogget bruker; admin-sjekken skjer i koden
# mot ADMIN_EMAILS-secreten.
[functions.admin]
verify_jwt = true

# Kalles av pg_cron med service_role-nøkkel (dryppvis oppskriftshøsting).
[functions.harvest-recipes]
verify_jwt = false

[functions.web-offer-scan]
verify_jwt = false

[functions.read-offer-photo]
verify_jwt = true

[functions.calendar-feed]
verify_jwt = false

# Betaling. Checkout og portalen krever innlogget bruker; eierskapet
# sjekkes i databasen med brukerens egen JWT.
[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

# Kalles av Stripe, ikke av appen. Ekthet avgjøres av signaturen, ikke av
# en JWT — derfor må plattformen slippe forespørselen inn.
[functions.stripe-webhook]
verify_jwt = false

# Nattjobb: lærer prisene fra kvitteringene. Kalles av cron med
# servicenøkkel, som ikke er en JWT — derfor false, som de andre
# bakgrunnsjobbene.
[functions.learn-prices]
verify_jwt = false

# Henter fremgangsmåten fra én oppskriftsside brukeren selv har valgt.
# Krever innlogget bruker, og sjekker selv at kilden har gitt tillatelse.
[functions.fetch-recipe]
verify_jwt = true
